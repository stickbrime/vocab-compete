<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题集 · 词汇闯关训练</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--good:#22c55e;--bad:#ef4444;--txt:#e2e8f0;--dim:#94a3b8;--gold:#fbbf24;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#0f172a 0%,#1e1b4b 100%);color:var(--txt);min-height:100vh;padding:16px;}
.wrap{max-width:860px;margin:0 auto;}
header{text-align:center;padding:18px 0 10px;}
.topnav{display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(30,41,59,.7);border:1px solid #334155;border-radius:12px;margin-bottom:14px;font-size:.86rem;}
.nav-link{color:var(--dim);text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .2s;}
.nav-link:hover{color:var(--accent);background:rgba(56,189,248,.08);}
.nav-link.active{color:var(--accent);background:rgba(56,189,248,.12);font-weight:600;}
.nav-spacer{flex:1;}
.nav-user{color:var(--dim);font-size:.82rem;}
.nav-btn{padding:5px 12px;font-size:.78rem;border:1px solid #475569;border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;transition:all .2s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
h1{font-size:1.5rem;letter-spacing:1px;}
.sub{color:var(--dim);font-size:.82rem;margin-top:6px;}
.userbar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px;color:var(--dim);font-size:.82rem;}
.card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:22px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.w-item{padding:14px 0;border-bottom:1px dashed #334155;}
.w-item:last-child{border-bottom:none;}
.w-word{font-size:1.15rem;font-weight:700;color:var(--gold);}
.w-set{font-size:.72rem;color:var(--dim);margin-left:8px;}
.w-def{margin-top:4px;color:#c4b5fd;font-size:.92rem;}
.w-sent{margin-top:6px;font-size:.88rem;line-height:1.7;color:var(--txt);}
.w-trans{margin-top:3px;font-size:.84rem;color:var(--dim);}
.w-src{font-size:.72rem;color:var(--dim);margin-top:4px;}
.empty{text-align:center;padding:60px 20px;color:var(--dim);}
.empty .big{font-size:3rem;margin-bottom:12px;}
.btn{display:inline-block;padding:10px 18px;border:1px solid #475569;border-radius:10px;background:#2a2f3a;color:var(--txt);cursor:pointer;font-size:.88rem;text-decoration:none;transition:all .2s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);color:#082f49;border-color:var(--accent);font-weight:700;}
.btn-primary:hover{opacity:.9;color:#082f49;}
.tools{display:flex;gap:10px;justify-content:center;margin-top:18px;}
.del-btn{background:transparent;border:1px solid #475569;color:var(--dim);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.del-btn:hover{border-color:var(--bad);color:var(--bad);background:rgba(239,68,68,.08);}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html" class="nav-link">🏠 首页</a>
    <a href="wrong.html" class="nav-link active">📕 错题集</a>
    <a href="account.html" class="nav-link">👤 账户</a>
    <span class="nav-spacer"></span>
    <span class="nav-user">👤 <span id="userInfo">加载中…</span></span>
    <button class="nav-btn" id="logoutBtn">退出</button>
  </nav>
  <header>
    <h1>📕 错题集</h1>
    <div class="sub">汇总所有词集中答错的单词</div>
  </header>
  <div id="content" class="card"><div style="text-align:center;color:var(--dim);padding:40px 0">加载中…</div></div>
</div>
<script src="db.js"></script>
<script>
// Remember last visited page for post-login redirect
localStorage.setItem('vocab_last_page', 'wrong.html');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('logoutBtn').onclick = async () => {
  try { await DB.logout(); } catch(e){}
  location.href = 'login.html';
};

(async function init(){
  try {
    const user = await DB.getUser();
    document.getElementById('userInfo').textContent = user.email;

    const rawWords = await DB.getWrongWords();
    // Normalize: API returns { setId, setName, idx, item } — flatten to match UI
    const words = rawWords.map(w => ({
      word: w.item.word || w.word || '',
      def: w.item.def || w.def || '',
      sentence: w.item.sentence || w.sentence || '',
      translation: w.item.translation || w.translation || '',
      src: w.item.src || w.src || '',
      englishDef: w.item.englishDef || w.englishDef || '',
      setId: w.setId,
      setName: w.setName,
      index: w.idx ?? w.index
    }));
    const box = document.getElementById('content');

    if(!words.length){
      box.innerHTML = '<div class="empty"><div class="big">🎉</div><div>还没有错题，继续加油！</div><div class="tools"><a href="index.html" class="btn btn-primary">返回首页</a></div></div>';
      return;
    }

    function renderList(list) {
      if (!list.length) {
        box.innerHTML = '<div class="empty"><div class="big">🎉</div><div>错题已全部清除！</div><div class="tools"><a href="index.html" class="btn btn-primary">返回首页</a></div></div>';
        return;
      }
      let html = '<div style="margin-bottom:14px;color:var(--dim);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
        '<span>共 <b style="color:var(--bad)">' + list.length + '</b> 个错题</span>' +
        '<button id="genSetBtn" class="btn btn-primary" style="padding:8px 16px;font-size:.82rem">📝 生成错题词集</button>' +
        '</div>';
      list.forEach((w, wi) => {
        const archTag = w.archived ? ' <span style="font-size:10px;background:rgba(248,113,113,.15);color:#f87171;padding:1px 6px;border-radius:4px">已删除词集</span>' : '';
        html += '<div class="w-item" data-wi="' + wi + '"' + (w.archived ? ' data-arch="' + esc(w.archId || '') + '"' : '') + '>' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
            '<div style="flex:1">' +
              '<span class="w-word">' + esc(w.word) + '</span>' +
              '<span class="w-set">📂 ' + esc(w.setName) + '</span>' + archTag +
            '</div>' +
            '<button class="del-btn" data-set="' + esc(w.setId) + '" data-idx="' + w.index + '"' + (w.archived ? ' data-arch="' + esc(w.archId || '') + '"' : '') + ' title="从错题集移除">✕</button>' +
          '</div>' +
          '<div class="w-def">' + esc(w.def) + '</div>' +
          (w.sentence ? '<div class="w-sent">' + esc(w.sentence) + '</div>' : '') +
          (w.translation ? '<div class="w-trans">' + esc(w.translation) + '</div>' : '') +
          (w.src ? '<div class="w-src">📰 ' + esc(w.src) + '</div>' : '') +
          '</div>';
      });
      html += '<div class="tools"><a href="index.html" class="btn">← 返回首页</a></div>';
      box.innerHTML = html;

      // Bind delete buttons
      box.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = async () => {
          const setId = btn.dataset.set;
          const idx = btn.dataset.idx;
          const archId = btn.dataset.arch;
          if (!confirm('确定要从错题集移除这个单词吗？')) return;
          try {
            if (archId) {
              await DB.removeArchivedWrong(archId);
            } else {
              await DB.removeWrong(setId, parseInt(idx));
            }
            const wi = parseInt(btn.closest('.w-item').dataset.wi);
            list.splice(wi, 1);
            renderList(list);
          } catch(e) {
            alert('移除失败：' + e.message);
          }
        };
      });

      // Bind generate set button
      const genBtn = document.getElementById('genSetBtn');
      if (genBtn) genBtn.onclick = async () => {
        genBtn.disabled = true;
        genBtn.textContent = '生成中…';
        try {
          const seen = new Set();
          const items = [];
          list.forEach(w => {
            if (seen.has(w.word)) return;
            seen.add(w.word);
            items.push({
              word: w.word, def: w.def, sentence: w.sentence || '',
              translation: w.translation || '', src: w.src || '', englishDef: w.englishDef || ''
            });
          });
          const id = 'wrong_' + Date.now().toString(36);
          const name = '📕 错题集 · ' + new Date().toLocaleDateString('zh-CN') + ' · ' + items.length + '词';
          await DB.saveSet({ id, name, items });
          location.href = 'trainer.html?id=' + encodeURIComponent(id);
        } catch(e) {
          alert('生成词集失败：' + e.message);
          genBtn.disabled = false;
          genBtn.textContent = '📝 生成错题词集';
        }
      };
    }

    renderList(words);
  } catch(e) {
    document.getElementById('userInfo').textContent = '未登录';
    document.getElementById('content').innerHTML = '<div class="empty"><div class="big">🔒</div><div>请先登录以查看你的错题集</div><div class="tools"><a href="login.html" class="btn btn-primary">前往登录</a> <a href="index.html" class="btn">返回首页</a></div></div>';
  }
})();
</script>
</body>
</html>
