<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题集 · 词汇闯关训练</title>
<style>
:root{--bg:#101013;--panel:#17171B;--panel2:#1D1D22;--line:#2B2B31;--ink:#F4F4F1;--dim:#8E8E96;--accent:#D8F43C;--accent-ink:#111100;--bad:#FF5449;--good:#6FDD8B;--gold:#FFD23F;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px;}
.wrap{max-width:860px;margin:0 auto;}
header{text-align:center;padding:18px 0 10px;}
.topnav{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;font-size:.86rem;}
.nav-link{color:var(--dim);text-decoration:none;padding:6px 12px;transition:all .15s;}
.nav-link:hover{color:var(--accent);background:#1B1E24;}
.nav-link.active{color:var(--accent);background:#1B1E24;font-weight:600;}
.nav-spacer{flex:1;}
.nav-user{color:var(--dim);font-size:.82rem;}
.nav-btn{padding:5px 12px;font-size:.72rem;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
h1{text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:1.02rem;}
.sub{font-size:.78rem;color:var(--dim);margin-top:6px;}
.userbar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px;color:var(--dim);font-size:.82rem;}
.card{background:var(--panel);border:1px solid var(--line);padding:22px;margin-top:14px;}
.w-item{padding:14px 0;border-bottom:1px dashed var(--line);}
.w-item:last-child{border-bottom:none;}
.w-word{font-size:1.15rem;font-weight:700;color:var(--gold);}
.w-set{font-size:.72rem;color:var(--dim);margin-left:8px;font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;}
.w-def{margin-top:4px;color:var(--ink);font-size:.92rem;}
.w-sent{margin-top:6px;font-size:.88rem;line-height:1.7;color:var(--ink);}
.w-trans{margin-top:3px;font-size:.84rem;color:var(--dim);}
.w-src{font-size:.72rem;color:var(--dim);margin-top:4px;font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;}
.empty{text-align:center;padding:60px 20px;color:var(--dim);}
.empty .big{font-size:2rem;margin-bottom:12px;color:var(--accent);}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:.88rem;text-decoration:none;transition:all .15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
.btn-primary:hover{border-color:var(--accent);color:var(--accent-ink);}
.tools{display:flex;gap:10px;justify-content:center;margin-top:18px;}
.del-btn{background:transparent;border:1px solid var(--line);color:var(--dim);width:28px;height:28px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.del-btn:hover{border-color:var(--bad);color:var(--bad);background:#1F1113;}
</style>
</head>
<body>
<script src="shared.js"></script>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html" class="nav-link">首页</a>
    <a href="workshop.html" class="nav-link">创意工坊</a>
    <a href="wrong.html" class="nav-link active">错题集</a>
    <a href="account.html" class="nav-link">账户</a>
    <span class="nav-spacer"></span>
    <span class="nav-user"><span id="userInfo">加载中…</span></span>
    <button class="nav-btn" id="logoutBtn">退出</button>
  </nav>
  <header>
    <h1>错题集</h1>
    <div class="sub">汇总所有词集中答错的单词</div>
  </header>
  <div id="content" class="card"><div style="text-align:center;color:var(--dim);padding:40px 0">加载中…</div></div>
</div>
<script src="db.js"></script>
<script>
// Remember last visited page for post-login redirect
localStorage.setItem('vocab_last_page', 'wrong.html');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('logoutBtn').onclick = async () => {
  try { await DB.logout(); } catch(e){}
  location.href = 'login.html';
};

(async function init(){
  try {
    const user = await DB.getUser();
    document.getElementById('userInfo').textContent = user.email;

    const rawWords = await DB.getWrongWords();
    // Normalize: records may be flat ({word, def, ...}) or wrapped ({item: {...}})
    const words = rawWords.map(w => {
      const it = w.item || w;
      return {
        word: it.word || '',
        def: it.def || '',
        sentence: it.sentence || '',
        translation: it.translation || '',
        src: it.src || '',
        englishDef: it.englishDef || '',
        setId: w.setId,
        setName: w.setName,
        index: w.idx ?? w.index,
        archived: !!w.archived,
        archId: w.archId || ''
      };
    });
    const box = document.getElementById('content');

    if(!words.length){
      box.innerHTML = '<div class="empty"><div class="big">■</div><div>还没有错题，继续加油！</div><div class="tools"><a href="index.html" class="btn btn-primary">返回首页</a></div></div>';
      return;
    }

    function renderList(list) {
      if (!list.length) {
        box.innerHTML = '<div class="empty"><div class="big">■</div><div>错题已全部清除！</div><div class="tools"><a href="index.html" class="btn btn-primary">返回首页</a></div></div>';
        return;
      }
      let html = '<div style="margin-bottom:14px;color:var(--dim);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
        '<span>共 <b style="color:var(--bad)">' + list.length + '</b> 个错题</span>' +
        '<button id="genSetBtn" class="btn btn-primary" style="padding:8px 16px;font-size:.82rem">生成错题词集</button>' +
        '</div>';
      list.forEach((w, wi) => {
        const archTag = w.archived ? ' <span style="font-size:10px;background:#1F1113;color:#FF5449;padding:1px 6px;border:1px solid #5C2A28">已删除词集</span>' : '';
        html += '<div class="w-item" data-wi="' + wi + '"' + (w.archived ? ' data-arch="' + esc(w.archId || '') + '"' : '') + '>' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
            '<div style="flex:1">' +
              '<span class="w-word">' + esc(w.word) + '</span>' +
              '<span class="w-set">' + esc(w.setName) + '</span>' + archTag +
            '</div>' +
            '<button class="del-btn" data-set="' + esc(w.setId) + '" data-idx="' + w.index + '"' + (w.archived ? ' data-arch="' + esc(w.archId || '') + '"' : '') + ' title="从错题集移除">✕</button>' +
          '</div>' +
          '<div class="w-def">' + esc(w.def) + '</div>' +
          (w.sentence ? '<div class="w-sent">' + esc(w.sentence) + '</div>' : '') +
          (w.translation ? '<div class="w-trans">' + esc(w.translation) + '</div>' : '') +
          (w.src ? '<div class="w-src">' + esc(w.src) + '</div>' : '') +
          '</div>';
      });
      html += '<div class="tools"><a href="index.html" class="btn">← 返回首页</a></div>';
      box.innerHTML = html;

      // Bind delete buttons
      box.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = async () => {
          const setId = btn.dataset.set;
          const idx = btn.dataset.idx;
          const archId = btn.dataset.arch;
          if (!confirm('确定要从错题集移除这个单词吗？')) return;
          try {
            if (archId) {
              await DB.removeArchivedWrong(archId);
            } else {
              await DB.removeWrong(setId, parseInt(idx));
            }
            const wi = parseInt(btn.closest('.w-item').dataset.wi);
            list.splice(wi, 1);
            renderList(list);
          } catch(e) {
            alert('移除失败：' + e.message);
          }
        };
      });

      // Bind generate set button
      const genBtn = document.getElementById('genSetBtn');
      if (genBtn) genBtn.onclick = async () => {
        genBtn.disabled = true;
        genBtn.textContent = '生成中…';
        try {
          const seen = new Set();
          const items = [];
          list.forEach(w => {
            if (seen.has(w.word)) return;
            seen.add(w.word);
            items.push({
              word: w.word, def: w.def, sentence: w.sentence || '',
              translation: w.translation || '', src: w.src || '', englishDef: w.englishDef || ''
            });
          });
          const id = 'wrong_' + Date.now().toString(36);
          const name = '错题集 · ' + new Date().toLocaleDateString('zh-CN') + ' · ' + items.length + '词';
          await DB.saveSet({ id, name, items });
          location.href = 'trainer.html?id=' + encodeURIComponent(id);
        } catch(e) {
          alert('生成词集失败：' + e.message);
          genBtn.disabled = false;
          genBtn.textContent = '生成错题词集';
        }
      };
    }

    renderList(words);
  } catch(e) {
    console.error('错题集加载失败:', e);
    // Distinguish real auth failure (401) from other errors (network, data shape, ...)
    const isAuth = e && (e.status === 401 || /401|unauthorized|未登录/i.test(e.message || ''));
    if (isAuth) {
      document.getElementById('userInfo').textContent = '未登录';
      document.getElementById('content').innerHTML = '<div class="empty"><div class="big">!</div><div>请先登录以查看你的错题集</div><div class="tools"><a href="login.html" class="btn btn-primary">前往登录</a> <a href="index.html" class="btn">返回首页</a></div></div>';
    } else {
      document.getElementById('content').innerHTML = '<div class="empty"><div class="big">!</div><div>错题集加载出错：' + esc(e.message || String(e)) + '</div><div class="tools"><button class="btn btn-primary" onclick="location.reload()">重试</button> <a href="index.html" class="btn">返回首页</a></div></div>';
    }
  }
})();
</script>
</body>
</html>
