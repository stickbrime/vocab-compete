<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户设置 — Vocab Trainer</title>
<style>
  :root {
    --bg: #101013;
    --panel: #17171B;
    --panel-2: #1D1D22;
    --text: #F4F4F1;
    --dim: #8E8E96;
    --accent: #D8F43C;
    --accent-ink: #111100;
    --ok: #6FDD8B;
    --danger: #FF5449;
    --line: #2B2B31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 {
    margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text);
  }
  .subtitle { color: var(--dim); font-size: 13px; margin-bottom: 28px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; }

  .topnav { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border: 1px solid var(--line); margin-bottom: 24px; font-size: .86rem; }
  .nav-link { color: var(--dim); text-decoration: none; padding: 6px 12px; transition: all .15s; }
  .nav-link:hover { color: var(--accent); }
  .nav-link.active { color: var(--accent); font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-user { color: var(--dim); font-size: .82rem;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  .nav-btn { padding: 5px 12px; font-size: .72rem; border: 1px solid var(--line);
    background: transparent; color: var(--dim); cursor: pointer; transition: all .15s;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 0;
  }
  .card + .card { border-top: none; }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 16px;
    display: flex; align-items: center; gap: 8px; text-transform: uppercase;
    letter-spacing: .1em; font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0; border: 1px solid var(--line); border-bottom: none;
  }
  .stat-box {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-top: none;
    padding: 16px 12px;
    text-align: center;
  }
  .stat-num {
    font-size: 28px; font-weight: 700; margin-bottom: 4px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-feature-settings: "tnum";
  }
  .stat-label { font-size: 11px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .1em; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .stat-mastered .stat-num { color: var(--ok); }
  .stat-wrong .stat-num { color: var(--danger); }
  .stat-words .stat-num { color: var(--accent); }
  .stat-sets .stat-num { color: var(--accent); opacity: .7; }

  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--dim); font-size: 14px; }
  .info-value { color: var(--text); font-size: 14px; font-weight: 500;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .1em;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .form-group input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 10px 18px; cursor: pointer; font-size: 14px; font-weight: 500;
    transition: all .15s;
  }
  .btn:hover { background: #1B1E24; border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink);
  }
  .btn-primary:hover { background: var(--accent-ink); color: var(--accent); }
  .btn-danger {
    background: transparent; border: 1px solid #5C2A28; color: var(--danger);
  }
  .btn-danger:hover { background: #1F1113; }
  .msg {
    font-size: 13px; padding: 8px 12px; margin-top: 12px; display: none;
  }
  .msg.ok { display: block; background: #141B11; color: var(--ok); border: 1px solid #33502B; }
  .msg.err { display: block; background: #1F1113; color: var(--danger); border: 1px solid #5C2A28; }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<script src="shared.js"></script>
<div class="container">
  <nav class="topnav">
    <a href="index.html" class="nav-link"> 首页</a>
    <a href="workshop.html" class="nav-link"> 创意工坊</a>
    <a href="wrong.html" class="nav-link"> 错题集</a>
    <a href="account.html" class="nav-link active"> 账户</a>
    <span class="nav-spacer"></span>
    <span class="nav-user"> <span id="userInfo">加载中…</span></span>
    <button class="nav-btn" id="logoutBtn">退出</button>
  </nav>

  <h1> 账户设置</h1>
  <div class="subtitle">管理你的账户信息和密码</div>

  <!-- Avatar -->
  <div class="card">
    <div class="card-title">头像</div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div id="avatarPreview" style="width:64px;height:64px;border:1px solid var(--line);background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--accent);font-family:'SF Mono',ui-monospace,Menlo,monospace;overflow:hidden;flex-shrink:0;">?</div>
      <div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="uploadAvatarBtn">上传头像</button>
          <button class="btn" id="deleteAvatarBtn">删除头像</button>
        </div>
        <div style="color:var(--dim);font-size:12px;margin-top:8px;font-family:'SF Mono',ui-monospace,Menlo,monospace;">支持 JPG / PNG，自动压缩为 200×200</div>
      </div>
    </div>
    <div class="msg" id="avatarMsg"></div>
  </div>

  <!-- Stats -->
  <div class="card">
    <div class="card-title"> 学习统计</div>
    <div class="stats-grid">
      <div class="stat-box stat-sets">
        <div class="stat-num" id="statSets">—</div>
        <div class="stat-label">词集数</div>
      </div>
      <div class="stat-box stat-words">
        <div class="stat-num" id="statWords">—</div>
        <div class="stat-label">总单词数</div>
      </div>
      <div class="stat-box stat-mastered">
        <div class="stat-num" id="statMastered">—</div>
        <div class="stat-label">已掌握</div>
      </div>
      <div class="stat-box stat-wrong">
        <div class="stat-num" id="statWrong">—</div>
        <div class="stat-label">错题数</div>
      </div>
    </div>
  </div>

  <!-- Account Info -->
  <div class="card">
    <div class="card-title"> 账户信息</div>
    <div class="info-row">
      <span class="info-label">邮箱</span>
      <span class="info-value" id="accEmail">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">用户 ID</span>
      <span class="info-value" id="accId" style="font-family:monospace;font-size:12px">—</span>
    </div>
  </div>

  <!-- Change Password -->
  <div class="card">
    <div class="card-title"> 修改密码</div>
    <div class="form-group">
      <label>当前密码</label>
      <input type="password" id="curPwd" placeholder="输入当前密码" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPwd" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="confirmPwd" placeholder="再次输入新密码" autocomplete="new-password">
    </div>
    <button class="btn btn-primary" id="changePwdBtn">更新密码</button>
    <div class="msg" id="pwdMsg"></div>
  </div>

  <!-- Danger Zone -->
  <div class="card" style="border-color: #3b1414;">
    <div class="card-title" style="color: var(--danger);"> 退出登录</div>
    <p style="color: var(--muted); font-size: 13px; margin: 0 0 16px;">退出后需要重新登录才能访问你的词集和进度。你的数据不会丢失。</p>
    <button class="btn btn-danger" id="logoutBtn2">退出登录</button>
  </div>
</div>

<script src="db.js"></script>
<script>
// Remember last visited page
localStorage.setItem('vocab_last_page', 'account.html');

(async () => {
  try {
    // Load user info
    const user = await DB.getUser();
    document.getElementById('userInfo').textContent = user.email;
    document.getElementById('accEmail').textContent = user.email;
    document.getElementById('accId').textContent = user.id;
    renderAvatar(user);

    // Load stats
    const s = await DB.getStats();
    document.getElementById('statSets').textContent = s.setCount;
    document.getElementById('statWords').textContent = s.totalWords;
    document.getElementById('statMastered').textContent = s.totalMastered;
    document.getElementById('statWrong').textContent = s.totalWrong;
  } catch(e) {
    location.href = 'login.html';
  }
})();

// Avatar management
let _user = null;
function renderAvatar(user){
  _user = user;
  const el = document.getElementById('avatarPreview');
  if(user.avatar){
    el.innerHTML = '<img src="' + user.avatar + '" style="width:100%;height:100%;object-fit:cover;display:block;" alt="头像">';
  } else {
    const c = (user.email || '?').charAt(0).toUpperCase();
    el.textContent = /[A-Z0-9]/.test(c) ? c : '?';
  }
  if(window.SH) SH.setAvatar(user);
}
function avatarMsg(text, ok){
  const m = document.getElementById('avatarMsg');
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
}
document.getElementById('uploadAvatarBtn').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if(!file) return;
    try {
      const dataUrl = await SH.resizeImage(file, 200, 200, 0.85);
      await DB.uploadAvatar(dataUrl);
      _user.avatar = dataUrl;
      renderAvatar(_user);
      avatarMsg('✓ 头像已更新', true);
    } catch(e){
      avatarMsg(e.message || '上传失败', false);
    }
  };
  input.click();
};
document.getElementById('deleteAvatarBtn').onclick = async () => {
  if(!_user || !_user.avatar){ avatarMsg('当前没有头像', false); return; }
  try {
    await DB.deleteAvatar();
    delete _user.avatar;
    renderAvatar(_user);
    avatarMsg('✓ 头像已删除', true);
  } catch(e){
    avatarMsg(e.message || '删除失败', false);
  }
};

// Change password
document.getElementById('changePwdBtn').onclick = async () => {
  const cur = document.getElementById('curPwd').value;
  const pwd = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const msg = document.getElementById('pwdMsg');

  msg.className = 'msg';
  if (!cur || !pwd) { msg.className = 'msg err'; msg.textContent = '请填写当前密码和新密码'; return; }
  if (pwd.length < 6) { msg.className = 'msg err'; msg.textContent = '新密码至少 6 位'; return; }
  if (pwd !== confirm) { msg.className = 'msg err'; msg.textContent = '两次输入的新密码不一致'; return; }

  const btn = document.getElementById('changePwdBtn');
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    const data = await DB.changePassword(cur, pwd);
    msg.className = 'msg ok'; msg.textContent = '✓ 密码已更新';
    document.getElementById('curPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('confirmPwd').value = '';
  } catch(e) {
    msg.className = 'msg err'; msg.textContent = e.message || '更新失败';
  } finally {
    btn.disabled = false; btn.textContent = '更新密码';
  }
};

// Logout
async function doLogout() {
  try { await DB.logout(); } catch(e) {}
  location.href = 'login.html';
}
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('logoutBtn2').onclick = doLogout;
</script>
</body>
</html>
