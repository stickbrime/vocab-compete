<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户设置 — Vocab Trainer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --text: #e7e9ee;
    --muted: #9aa0aa;
    --accent: #6ea8ff;
    --accent-2: #8b5cf6;
    --ok: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .topnav { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: rgba(30,41,59,.7); border: 1px solid #334155; border-radius: 12px; margin-bottom: 24px; font-size: .86rem; }
  .nav-link { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: all .2s; }
  .nav-link:hover { color: var(--accent); background: rgba(56,189,248,.08); }
  .nav-link.active { color: var(--accent); background: rgba(56,189,248,.12); font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-user { color: var(--muted); font-size: .82rem; }
  .nav-btn { padding: 5px 12px; font-size: .78rem; border: 1px solid #475569; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; transition: all .2s; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .stat-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
  }
  .stat-mastered .stat-num { color: var(--ok); }
  .stat-wrong .stat-num { color: var(--danger); }
  .stat-words .stat-num { color: var(--accent); }
  .stat-sets .stat-num { color: var(--accent-2); }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--muted); font-size: 14px; }
  .info-value { color: var(--text); font-size: 14px; font-weight: 500; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 14px;
    font-weight: 500; transition: all .15s;
  }
  .btn:hover { background: #2a2f3a; border-color: #3a414f; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-danger {
    background: transparent; border: 1px solid #5b2121; color: var(--danger);
  }
  .btn-danger:hover { background: rgba(248,113,113,.08); }
  .msg {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
  }
  .msg.ok { display: block; background: rgba(74,222,128,.1); color: var(--ok); border: 1px solid rgba(74,222,128,.2); }
  .msg.err { display: block; background: rgba(248,113,113,.1); color: var(--danger); border: 1px solid rgba(248,113,113,.2); }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <nav class="topnav">
    <a href="index.html" class="nav-link">🏠 首页</a>
    <a href="wrong.html" class="nav-link">📕 错题集</a>
    <a href="account.html" class="nav-link active">👤 账户</a>
    <span class="nav-spacer"></span>
    <span class="nav-user">👤 <span id="userInfo">加载中…</span></span>
    <button class="nav-btn" id="logoutBtn">退出</button>
  </nav>

  <h1>👤 账户设置</h1>
  <div class="subtitle">管理你的账户信息和密码</div>

  <!-- Stats -->
  <div class="card">
    <div class="card-title">📊 学习统计</div>
    <div class="stats-grid">
      <div class="stat-box stat-sets">
        <div class="stat-num" id="statSets">—</div>
        <div class="stat-label">词集数</div>
      </div>
      <div class="stat-box stat-words">
        <div class="stat-num" id="statWords">—</div>
        <div class="stat-label">总单词数</div>
      </div>
      <div class="stat-box stat-mastered">
        <div class="stat-num" id="statMastered">—</div>
        <div class="stat-label">已掌握</div>
      </div>
      <div class="stat-box stat-wrong">
        <div class="stat-num" id="statWrong">—</div>
        <div class="stat-label">错题数</div>
      </div>
    </div>
  </div>

  <!-- Account Info -->
  <div class="card">
    <div class="card-title">📋 账户信息</div>
    <div class="info-row">
      <span class="info-label">邮箱</span>
      <span class="info-value" id="accEmail">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">用户 ID</span>
      <span class="info-value" id="accId" style="font-family:monospace;font-size:12px">—</span>
    </div>
  </div>

  <!-- Change Password -->
  <div class="card">
    <div class="card-title">🔐 修改密码</div>
    <div class="form-group">
      <label>当前密码</label>
      <input type="password" id="curPwd" placeholder="输入当前密码" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPwd" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="confirmPwd" placeholder="再次输入新密码" autocomplete="new-password">
    </div>
    <button class="btn btn-primary" id="changePwdBtn">更新密码</button>
    <div class="msg" id="pwdMsg"></div>
  </div>

  <!-- Danger Zone -->
  <div class="card" style="border-color: #3b1414;">
    <div class="card-title" style="color: var(--danger);">⚠️ 退出登录</div>
    <p style="color: var(--muted); font-size: 13px; margin: 0 0 16px;">退出后需要重新登录才能访问你的词集和进度。你的数据不会丢失。</p>
    <button class="btn btn-danger" id="logoutBtn2">退出登录</button>
  </div>
</div>

<script>
// Remember last visited page
localStorage.setItem('vocab_last_page', 'account.html');

(async () => {
  try {
    // Load user info
    const res = await fetch('/api/user');
    if (!res.ok) { location.href = 'login.html'; return; }
    const user = await res.json();
    document.getElementById('userInfo').textContent = user.email;
    document.getElementById('accEmail').textContent = user.email;
    document.getElementById('accId').textContent = user.id;

    // Load stats
    const statsRes = await fetch('/api/user/stats');
    if (statsRes.ok) {
      const s = await statsRes.json();
      document.getElementById('statSets').textContent = s.setCount;
      document.getElementById('statWords').textContent = s.totalWords;
      document.getElementById('statMastered').textContent = s.totalMastered;
      document.getElementById('statWrong').textContent = s.totalWrong;
    }
  } catch(e) {
    location.href = 'login.html';
  }
})();

// Change password
document.getElementById('changePwdBtn').onclick = async () => {
  const cur = document.getElementById('curPwd').value;
  const pwd = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const msg = document.getElementById('pwdMsg');

  msg.className = 'msg';
  if (!cur || !pwd) { msg.className = 'msg err'; msg.textContent = '请填写当前密码和新密码'; return; }
  if (pwd.length < 6) { msg.className = 'msg err'; msg.textContent = '新密码至少 6 位'; return; }
  if (pwd !== confirm) { msg.className = 'msg err'; msg.textContent = '两次输入的新密码不一致'; return; }

  const btn = document.getElementById('changePwdBtn');
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    const res = await fetch('/api/user/password', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword: cur, newPassword: pwd })
    });
    const data = await res.json();
    if (!res.ok) { msg.className = 'msg err'; msg.textContent = data.error || '更新失败'; return; }
    msg.className = 'msg ok'; msg.textContent = '✅ 密码已更新';
    document.getElementById('curPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('confirmPwd').value = '';
  } catch(e) {
    msg.className = 'msg err'; msg.textContent = '网络错误，请重试';
  } finally {
    btn.disabled = false; btn.textContent = '更新密码';
  }
};

// Logout
async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {}
  location.href = 'login.html';
}
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('logoutBtn2').onclick = doLogout;
</script>
</body>
</html>
