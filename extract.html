<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步骤 1 · 提取 PDF 文本</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --panel-2: #22262f; --text: #e7e9ee;
    --muted: #9aa0aa; --accent: #6ea8ff; --accent-2: #8b5cf6;
    --ok: #4ade80; --warn: #fbbf24; --danger: #f87171; --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }
  .steps { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .step-chip {
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .step-chip.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
  }
  .step-chip.done { background: rgba(74,222,128,.12); color: var(--ok); border-color: rgba(74,222,128,.3); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 {
    margin: 0; font-size: 26px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .back { color: var(--muted); text-decoration: none; font-size: 14px; }
  .back:hover { color: var(--text); }

  .dropzone {
    border: 2px dashed var(--border); border-radius: 14px; padding: 36px;
    text-align: center; color: var(--muted); cursor: pointer; transition: all .15s;
    background: var(--panel-2); margin-bottom: 16px;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--text); }
  .dropzone .icon { font-size: 36px; margin-bottom: 8px; }
  .dropzone .filename { color: var(--accent); font-weight: 500; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .panel-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 320px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 8px; font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; resize: vertical; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px;
    font-weight: 500; transition: all .15s; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: #2a2f3a; border-color: #3a414f; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff;
  }
  .btn-primary:hover { opacity: .92; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>
<div class="container">
  <div class="steps">
    <div class="step-chip active">① 提取 PDF 文本</div>
    <div class="step-chip">② 转成网页</div>
  </div>

  <header>
    <div>
      <h1>提取 PDF / DOCX 文本</h1>
      <div class="subtitle">上传文档，自动提取文字，检查无误后发送到第 2 步生成闯关网页</div>
    </div>
    <a class="back" href="index.html">← 返回首页</a>
  </header>

  <div class="dropzone" id="dropzone">
    <div class="icon">📄</div>
    <div>点击选择 PDF / DOCX 文件，或拖拽到此</div>
    <div class="filename" id="filename"></div>
  </div>
  <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.csv,.tsv" style="display:none">

  <div class="panel" id="resultPanel" style="display:none">
    <div class="panel-title">
      <span>提取结果</span>
      <span class="meta" id="charCount"></span>
    </div>
    <div class="meta">可直接编辑，修正排版后再发送到下一步</div>
    <textarea id="textOutput" placeholder="提取的文本将显示在这里…"></textarea>
    <div class="toolbar">
      <button class="btn" id="copyBtn">📋 复制文本</button>
      <button class="btn" id="downloadBtn">💾 下载为 .txt</button>
      <button class="btn-primary btn" id="sendBtn">→ 发送到网页转换器（步骤 2）</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="extract_lib.js"></script>
<script>
const PENDING_KEY = 'vocab_pending_extract';
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const textOutput = document.getElementById('textOutput');
const resultPanel = document.getElementById('resultPanel');
const charCount = document.getElementById('charCount');
const statusEl = document.getElementById('status');

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  setTimeout(() => el.classList.remove('show'), 2000);
}

function setStatus(msg, type='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + type;
}

function updateCount() {
  const t = textOutput.value;
  const chars = t.length;
  const lines = t ? t.split('\n').length : 0;
  charCount.textContent = `${chars} 字符 · ${lines} 行`;
}

async function handleFile(file) {
  filenameEl.textContent = '📎 ' + file.name + ' · 提取中…';
  setStatus('⏳ 正在解析文件…');
  try {
    const text = await extractTextFromFile(file);
    filenameEl.textContent = '📎 ' + file.name;
    textOutput.value = text;
    resultPanel.style.display = 'block';
    updateCount();
    setStatus(`✓ 提取成功（共 ${text.length} 字符）`, 'ok');
    // Auto-stash so converter can pick it up
    localStorage.setItem(PENDING_KEY, text);
  } catch (err) {
    filenameEl.textContent = '📎 ' + file.name;
    setStatus('✗ ' + (err.message || String(err)), 'err');
  }
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
['dragenter','dragover'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave','drop'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', e => {
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

textOutput.addEventListener('input', () => {
  updateCount();
  localStorage.setItem(PENDING_KEY, textOutput.value);
});

document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(textOutput.value).then(
    () => toast('已复制到剪贴板'),
    () => { textOutput.select(); document.execCommand('copy'); toast('已复制'); }
  );
};

document.getElementById('downloadBtn').onclick = () => {
  const blob = new Blob([textOutput.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'extracted_text.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('sendBtn').onclick = () => {
  const text = textOutput.value.trim();
  if (!text) { toast('文本为空'); return; }
  localStorage.setItem(PENDING_KEY, text);
  toast('已发送，正在跳转到步骤 2…');
  setTimeout(() => { location.href = 'index.html?from=extract'; }, 400);
};

// Restore previous session if present
const prev = localStorage.getItem(PENDING_KEY);
if (prev) {
  textOutput.value = prev;
  resultPanel.style.display = 'block';
  updateCount();
  setStatus('已恢复上次提取的文本', 'ok');
}
</script>
</body>
</html>
