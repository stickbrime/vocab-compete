<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创意工坊 · Vocab Trainer</title>
<style>
  :root {
    --bg:#101013; --panel:#17171B; --panel2:#1D1D22; --line:#2B2B31;
    --ink:#F4F4F1; --dim:#8E8E96; --accent:#D8F43C; --accent-ink:#111100;
    --bad:#FF5449; --good:#6FDD8B; --gold:#FFD23F;
    /* legacy aliases (referenced by inline styles in scripts) */
    --text:var(--ink); --muted:var(--dim); --border:var(--line);
    --panel-2:var(--panel2); --ok:var(--good); --danger:var(--bad); --accent-2:var(--accent);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif; background: #101013; color: var(--ink);
    min-height: 100vh; line-height: 1.6;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 {
    margin: 0; font-size: 1.02rem; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink);
  }
  .subtitle { color: var(--dim); font-size: .78rem; margin-top: 6px; }
  .topnav {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border: 1px solid var(--line);
    margin: 16px 0; font-size: .86rem;
  }
  .nav-link { color: var(--dim); text-decoration: none; padding: 6px 12px; border: 1px solid transparent; transition: color .15s; }
  .nav-link:hover { color: var(--accent); }
  .nav-link.active { color: var(--accent); background: #1B1E24; font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-user { color: var(--dim); font-size: .72rem; font-family: var(--mono); letter-spacing: .06em; }
  .nav-btn { padding: 5px 12px; font-size: .72rem; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; transition: color .15s, border-color .15s; text-decoration: none; font-family: inherit; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .btn {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    padding: 10px 16px; cursor: pointer; font-size: .82rem;
    font-weight: 500; transition: color .15s, border-color .15s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border: 1px solid var(--accent); color: #111100; font-weight: 700; }
  .btn-primary:hover { border-color: var(--accent); color: #111100; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .tab {
    padding: 8px 16px; border: 1px solid var(--line); background: transparent;
    color: var(--dim); cursor: pointer; font-size: .78rem; transition: color .15s, border-color .15s; font-family: inherit;
  }
  .tab:hover { color: var(--ink); border-color: var(--dim); }
  .tab.active { background: var(--accent); color: #111100; border-color: var(--accent); font-weight: 700; }
  .search-box {
    flex: 1; min-width: 200px; max-width: 340px; padding: 8px 14px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font-size: .82rem; font-family: inherit;
  }
  .search-box:focus { outline: none; border-color: var(--accent); }

  .bank-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
  }
  .bank-card {
    background: var(--panel); border: 1px solid var(--line);
    overflow: hidden; cursor: pointer; transition: border-color .15s; display: flex; flex-direction: column;
  }
  .bank-card:hover { border-color: var(--accent); }
  .thumb {
    height: 140px; background: var(--panel2); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .word-count {
    position: absolute; bottom: 8px; right: 8px; background: #101013; color: var(--ink);
    padding: 3px 8px; border: 1px solid var(--line); font-size: .72rem; font-weight: 600;
    font-family: var(--mono); letter-spacing: .06em; font-feature-settings: "tnum";
  }
  .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; word-break: break-word; color: var(--ink); }
  .card-author { font-size: .72rem; color: var(--dim); margin-bottom: 8px; font-family: var(--mono); letter-spacing: .06em; }
  .card-desc { font-size: 12px; color: var(--dim); flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    padding: 2px 8px; border: 1px solid var(--line); font-size: .72rem; font-weight: 500;
    background: #1B1E24; color: var(--dim); font-family: var(--mono); letter-spacing: .06em;
  }
  .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; color: var(--dim); font-family: var(--mono); letter-spacing: .06em; font-feature-settings: "tnum"; }
  .card-footer .dl { color: var(--good); font-weight: 600; }

  .empty { text-align: center; padding: 64px 20px; color: var(--dim); border: 1px dashed var(--line); }
  .empty .big { font-size: 28px; margin-bottom: 12px; color: var(--accent); font-family: var(--mono); }
  .loading { text-align: center; padding: 60px 20px; color: var(--dim); }

  /* Detail modal */
  .modal-mask {
    position: fixed; inset: 0; background: #0B0B0D;
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .detail-modal {
    background: var(--panel); border: 1px solid var(--line);
    width: 100%; max-width: 720px; max-height: 88vh; overflow: auto;
  }
  .detail-thumb { height: 200px; background: var(--panel2); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; }
  .detail-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-close {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    border: 1px solid var(--line); background: #101013; color: var(--ink); cursor: pointer; font-size: 14px; font-family: var(--mono);
    display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s;
  }
  .detail-close:hover { border-color: var(--accent); color: var(--accent); }
  .detail-body { padding: 24px; }
  .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
  .detail-meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim); font-size: .72rem; margin-bottom: 14px; font-family: var(--mono); letter-spacing: .06em; font-feature-settings: "tnum"; }
  .detail-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .detail-desc { color: var(--ink); font-size: 14px; line-height: 1.7; margin-bottom: 16px; }
  .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .detail-section-title { font-size: .72rem; font-weight: 700; color: var(--accent); margin-bottom: 10px; font-family: var(--mono); letter-spacing: .06em; }
  .preview-list {
    max-height: 280px; overflow-y: auto; border: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .preview-item { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .preview-item:last-child { border-bottom: none; }
  .preview-word { font-weight: 700; color: var(--accent); }
  .preview-def { color: var(--dim); margin-left: 8px; }
  .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 18px; font-size: .82rem; opacity: 0;
    transition: opacity .15s; z-index: 200; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--good); }
  .toast.err { border-color: var(--bad); }
</style>
</head>
<body>
<script src="shared.js"></script>
<div class="container">
  <nav class="topnav">
    <a href="index.html" class="nav-link">首页</a>
    <a href="workshop.html" class="nav-link active">工坊</a>
    <a href="wrong.html" class="nav-link">错题集</a>
    <a href="account.html" class="nav-link">账户</a>
    <span class="nav-spacer"></span>
    <span class="nav-user"><span id="userInfo">加载中…</span></span>
    <a href="publish.html" class="nav-btn">发布词集</a>
    <button class="nav-btn" id="logoutBtn">退出</button>
  </nav>

  <div class="header-row">
    <div>
      <h1>创意工坊</h1>
      <div class="subtitle">浏览社区分享的词集，一键导入到你的训练列表</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-sort="top">热门</button>
    <button class="tab" data-sort="new">最新发布</button>
    <button class="tab" data-sort="downloads">下载量</button>
    <input type="text" class="search-box" id="searchBox" placeholder="搜索标题、作者或标签…">
  </div>

  <div id="grid"><div class="loading">加载中…</div></div>
</div>

<!-- Detail modal -->
<div class="modal-mask" id="detailModal">
  <div class="detail-modal" id="detailContent"></div>
</div>

<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type||'');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

document.getElementById('logoutBtn').onclick = async () => {
  try { await DB.logout(); } catch(e){}
  location.href = 'login.html';
};

let allBanks = [];
let currentSort = 'top';

async function loadBanks(sort) {
  currentSort = sort;
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loading">加载中…</div>';
  try {
    allBanks = await DB.listBanks(sort);
    renderGrid();
  } catch(e) {
    grid.innerHTML = '<div class="empty"><div class="big" style="color:var(--bad)">!</div><div>' + esc(e.message) + '</div><div style="margin-top:14px"><a href="index.html" class="btn">返回首页</a></div></div>';
  }
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const q = (document.getElementById('searchBox').value || '').toLowerCase().trim();
  let banks = allBanks;
  if (q) {
    banks = banks.filter(b =>
      (b.title||'').toLowerCase().includes(q) ||
      (b.author||'').toLowerCase().includes(q) ||
      (b.tags||[]).some(t => t.toLowerCase().includes(q)) ||
      (b.description||'').toLowerCase().includes(q)
    );
  }
  if (!banks.length) {
    grid.innerHTML = '<div class="empty"><div class="big">■</div><div>' + (q ? '没有匹配的词集' : '还没有发布的词集，快来发布第一个吧！') + '</div><div style="margin-top:14px"><a href="publish.html" class="btn btn-primary">发布词集</a></div></div>';
    return;
  }
  grid.innerHTML = '<div class="bank-grid">' + banks.map(b => {
    const thumb = b.thumbnail
      ? '<img src="' + esc(b.thumbnail) + '" alt="">'
      : '■';
    const tags = (b.tags||[]).slice(0,3).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
    return '<div class="bank-card" data-id="' + esc(b.id) + '">' +
      '<div class="thumb">' + thumb + '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + esc(b.title) + '</div>' +
        '<div class="card-author">' + esc(b.author) + ' · ' + fmtDate(b.createdAt) + '</div>' +
        '<div class="card-desc">' + esc(b.description || '暂无描述') + '</div>' +
        (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
        '<div class="card-footer"><span>' + fmtDate(b.createdAt) + '</span><span class="dl">下载 ' + (b.downloads||0) + '</span></div>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  grid.querySelectorAll('.bank-card').forEach(card => {
    card.onclick = () => showDetail(card.dataset.id);
  });
}

async function showDetail(id) {
  const modal = document.getElementById('detailModal');
  const content = document.getElementById('detailContent');
  modal.classList.add('show');
  content.innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted)">加载中…</div>';
  try {
    const bank = await DB.getBank(id);
    const items = bank.items || [];
    const thumb = bank.thumbnail
      ? '<img src="' + esc(bank.thumbnail) + '" alt="">'
      : '■';
    const tags = (bank.tags||[]).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
    const previewItems = items.slice(0, 30);
    content.innerHTML =
      '<div class="detail-thumb">' + thumb +
        '<button class="detail-close" id="closeDetail">✕</button>' +
      '</div>' +
      '<div class="detail-body">' +
        '<div class="detail-title">' + esc(bank.title) + '</div>' +
        '<div class="detail-meta">' +
          '<span>' + esc(bank.author) + '</span>' +
          '<span>发布于 ' + fmtDate(bank.createdAt) + '</span>' +
          '<span>下载 ' + (bank.downloads||0) + '</span>' +
          '<span>词数 ' + items.length + '</span>' +
        '</div>' +
        (tags ? '<div class="detail-tags">' + tags + '</div>' : '') +
        '<div class="detail-desc">' + esc(bank.description || '暂无描述') + '</div>' +
        '<div class="detail-section-title">词条预览（前 ' + previewItems.length + ' 个）</div>' +
        '<div class="preview-list">' +
          previewItems.map(it =>
            '<div class="preview-item"><span class="preview-word">' + esc(it.word) + '</span>' +
            '<span class="preview-def">' + esc(it.def || '') + '</span></div>'
          ).join('') +
        '</div>' +
        '<div class="detail-actions">' +
          '<button class="btn btn-primary" id="importBtn">导入到我的词集</button>' +
          '<a href="trainer.html?id=' + encodeURIComponent(id) + '" class="btn" id="tryBtn">试练（只读）</a>' +
          '<button class="btn" id="closeBtn2">关闭</button>' +
        '</div>' +
      '</div>';

    document.getElementById('closeDetail').onclick = () => modal.classList.remove('show');
    document.getElementById('closeBtn2').onclick = () => modal.classList.remove('show');
    document.getElementById('importBtn').onclick = async () => {
      const btn = document.getElementById('importBtn');
      btn.disabled = true; btn.textContent = '导入中…';
      try {
        const result = await DB.importBank(id);
        toast('导入成功！已添加到你的词集', 'ok');
        setTimeout(() => { location.href = 'index.html'; }, 1200);
      } catch(e) {
        toast('导入失败：' + e.message, 'err');
        btn.disabled = false; btn.textContent = '导入到我的词集';
      }
    };
  } catch(e) {
    content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger)">加载失败：' + esc(e.message) + '</div>';
  }
}

document.getElementById('detailModal').onclick = (e) => {
  if (e.target.id === 'detailModal') e.target.classList.remove('show');
};

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    loadBanks(tab.dataset.sort);
  };
});

// Search
document.getElementById('searchBox').oninput = renderGrid;

// Init
(async function() {
  try {
    const user = await DB.getUser();
    document.getElementById('userInfo').textContent = user.email;
  } catch(e) {
    document.getElementById('userInfo').textContent = '未登录';
  }
  loadBanks('top');
})();
</script>
</body>
</html>
