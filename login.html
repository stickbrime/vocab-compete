<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 词汇闯关训练</title>
<style>
:root{--bg:#101013;--card:#17171B;--panel2:#1D1D22;--line:#2B2B31;--accent:#D8F43C;--accent-ink:#111100;--txt:#F4F4F1;--dim:#8E8E96;--bad:#FF5449;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.wrap{width:100%;max-width:400px;}
.card{background:var(--card);border:1px solid var(--line);padding:32px 28px;}
h1{font-size:1.02rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;text-align:center;margin-bottom:6px;}
.sub{text-align:center;color:var(--dim);font-size:.78rem;margin-bottom:24px;}
.tabs{display:flex;border:1px solid var(--line);padding:4px;margin-bottom:20px;}
.tabs button{flex:1;padding:10px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:.9rem;transition:color .15s;}
.tabs button:hover{color:var(--txt);}
.tabs button.active{background:var(--accent);color:var(--accent-ink);font-weight:700;}
label{display:block;font-size:.82rem;color:var(--dim);margin-bottom:6px;}
input{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:.95rem;margin-bottom:14px;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--accent);}
button.submit{width:100%;padding:13px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px;transition:border-color .15s,color .15s;}
button.submit:hover{border-color:var(--accent);color:var(--accent-ink);}
.err{color:var(--bad);font-size:.82rem;margin-top:10px;min-height:18px;text-align:center;}
.hint{text-align:center;color:var(--dim);font-size:.72rem;margin-top:16px;line-height:1.6;font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;}
.mode-badge{text-align:center;font-size:.72rem;color:var(--dim);margin-top:12px;font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;font-feature-settings:"tnum";}
</style>
</head>
<body>
<script src="shared.js"></script>
<div class="wrap">
  <div class="card">
    <h1>词汇闯关训练</h1>
    <div class="sub">登录以保存你的学习进度</div>
    <div class="tabs">
      <button id="tabLogin" class="active">登录</button>
      <button id="tabReg">注册</button>
    </div>
    <form id="authForm">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      <label>密码</label>
      <input type="password" id="password" placeholder="至少 6 位" required autocomplete="current-password">
      <button type="submit" class="submit" id="submitBtn">登录</button>
      <div class="err" id="err"></div>
    </form>
    <div class="hint" id="hintText">登录后可在本地创建账号，数据保存在浏览器中</div>
    <div class="mode-badge" id="modeBadge"></div>
  </div>
</div>
<script src="db.js"></script>
<script>
let mode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabReg = document.getElementById('tabReg');
const form = document.getElementById('authForm');
const submitBtn = document.getElementById('submitBtn');
const errEl = document.getElementById('err');

tabLogin.onclick = () => setMode('login');
tabReg.onclick = () => setMode('register');

function setMode(m){
  mode = m;
  tabLogin.classList.toggle('active', m==='login');
  tabReg.classList.toggle('active', m==='register');
  submitBtn.textContent = m==='login' ? '登录' : '注册';
  errEl.textContent = '';
}

// Show mode badge
DB.probe().then(online => {
  document.getElementById('modeBadge').textContent = online ? '服务器模式' : '本地存储模式';
  document.getElementById('hintText').textContent = online
    ? '账号数据保存在服务器，用于学习进度同步'
    : '静态部署模式 · 数据保存在本地浏览器';
});

form.onsubmit = async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  submitBtn.disabled = true;
  submitBtn.textContent = '请稍候…';
  try {
    if (mode === 'login') {
      await DB.login(email, password);
    } else {
      await DB.register(email, password);
    }
    const last = localStorage.getItem('vocab_last_page');
    location.href = (last && last !== 'login.html') ? last : 'index.html';
  } catch(e) {
    errEl.textContent = e.message || '操作失败';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = mode==='login' ? '登录' : '注册';
  }
};
</script>
</body>
</html>
